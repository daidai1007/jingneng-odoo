  <script>
    (() => {
      const root=document.getElementById('jn-cabinet-width-preview');
      const part=name=>root.querySelector('[data-part="'+name+'"]');
      const field=name=>root.querySelector('[data-field="'+name+'"]');
      const design={density:'compact',showDiagram:true};
      let state={width:'600+800+600',quantity:2,depth:600,height:1800,series:'JP',material:'SECC',thickness:1.5,coating:'橘纹',color:'RAL7035 浅灰',doors:[{front:'auto',back:'panel'},{front:'auto',back:'panel'},{front:'auto',back:'panel'}],accessories:{'A4资料盒':true,'通风顶罩':true},manual:[],editing:true};
      const num=value=>Number(value).toLocaleString('zh-CN',{useGrouping:false,maximumFractionDigits:3});
      const escape=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const widths=()=>state.width.trim().split('+').map(value=>Number(value.trim()));
      function validate(){
        if(!/^\s*\d+(?:\.\d+)?(?:\s*\+\s*\d+(?:\.\d+)?)*\s*$/.test(state.width)||widths().some(w=>!Number.isFinite(w)||w<=0))return '请填写正数宽度，多个柜体用 + 分隔。';
        if(widths().length>20)return '每组并柜支持 2–20 个柜体。';
        if(!Number.isFinite(state.depth)||!Number.isFinite(state.height)||state.depth<=0||state.height<=0)return '请填写大于 0 的深度和高度。';
        if(!Number.isInteger(state.quantity)||state.quantity<1)return '请填写大于 0 的整数数量。';
        return '';
      }
      const frontText=(door,w)=>door?.front==='double'?'双开门':door?.front==='single'?'单开门':w>800?'双开门':'单开门';
      const backText=door=>door?.back==='single'?'单开门':door?.back==='double'?'双开门':'背板';
      function hydrate(snapshot){
        const saved=snapshot?.modelContent||snapshot;
        if(saved?.scheme==='宽度自动识别单柜并柜'&&typeof saved.width==='string'&&Array.isArray(saved.doors))state={...state,...saved};
        const extra=snapshot?.privateContent;
        if(extra&&typeof extra.editing==='boolean')state.editing=extra.editing;
      }
      function persist(){
        const modelContent={...state,scheme:'宽度自动识别单柜并柜'};delete modelContent.editing;
        if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent,privateContent:{editing:state.editing}}).catch(()=>{});
      }
      function draw(ws){
        const sum=ws.reduce((a,b)=>a+b,0),x=24,y=48,w=310,h=190;
        const labelSize=12*370/Math.max(210,part('drawing').clientWidth||350);
        let at=x;
        const bodies=ws.map((value,i)=>{
          const cw=w*value/sum,door=state.doors[i]||{},double=frontText(door,value)==='双开门';
          const shape='<rect x="'+at+'" y="'+y+'" width="'+cw+'" height="'+h+'" fill="none" stroke="currentColor"/><rect x="'+(at+4)+'" y="'+(y+4)+'" width="'+Math.max(1,cw-8)+'" height="'+(h-8)+'" fill="none" stroke="currentColor" stroke-width=".6"/>'+(double?'<line x1="'+(at+cw/2)+'" y1="'+(y+4)+'" x2="'+(at+cw/2)+'" y2="'+(y+h-4)+'" stroke="currentColor"/>':'')+'<rect x="'+(at+cw-12)+'" y="'+(y+h*.52)+'" width="3" height="13" fill="none" stroke="currentColor"/><text x="'+(at+cw/2)+'" y="'+(y-15)+'" text-anchor="middle" fill="currentColor">'+num(value)+'</text><text x="'+(at+cw/2)+'" y="'+(y+h+25)+'" text-anchor="middle" fill="currentColor">'+(i+1)+'号柜</text>';
          at+=cw;return shape;
        }).join('');
        part('drawing').innerHTML='<svg viewBox="0 0 370 330" width="100%" role="img" aria-label="'+ws.length+'个柜体横向排列，宽度'+ws.map(num).join('加')+'毫米，共用深度'+state.depth+'、高度'+state.height+'毫米"><g style="color:var(--jn-ink);font:'+labelSize+'px Microsoft YaHei,system-ui,sans-serif">'+bodies+'<line x1="24" y1="284" x2="334" y2="284" stroke="currentColor"/><line x1="24" y1="277" x2="24" y2="291" stroke="currentColor"/><line x1="334" y1="277" x2="334" y2="291" stroke="currentColor"/><text x="179" y="307" text-anchor="middle" fill="currentColor">总宽 '+num(sum)+' mm</text><text x="356" y="145" text-anchor="middle" fill="currentColor" transform="rotate(90 356 145)">高 '+num(state.height)+' mm</text></g></svg>';
      }
      function render(){
        const error=validate(),ws=error?[600,800,600]:widths(),ganged=ws.length>1,total=ws.reduce((a,b)=>a+b,0);
        while(state.doors.length<ws.length)state.doors.push({front:'auto',back:'panel'});
        part('error').hidden=!error;part('error').textContent=error;
        part('detected').textContent=error?'':ganged?'已识别 '+ws.length+' 柜并柜 · 总宽 '+num(total)+' mm':'已识别单柜 · 宽 '+num(total)+' mm';
        part('ganged-config').hidden=!ganged;
        part('single-front').hidden=ganged;part('single-back').hidden=ganged;
        field('single-front').value=state.doors[0].front;field('single-back').value=state.doors[0].back;
        field('single-front').querySelector('option[value="auto"]').textContent='自动（'+(ws[0]>800?'双开':'单开')+'）';
        part('depth-label').textContent=(ganged?'共用':'')+'深度（mm）';part('height-label').textContent=(ganged?'共用':'')+'高度（mm）';
        part('quantity-label').textContent=ganged?'数量（组）':'数量（台）';
        part('cab-count').textContent=ws.length+' 柜／组';
        part('cab-map').hidden=!design.showDiagram||ws.length>5;
        part('cab-map').innerHTML=ws.map((w,i)=>'<div class="jn-cab-block" style="flex-grow:'+w+'">'+(i+1)+'号柜<br>'+num(w)+'</div>').join('');
        part('cab-rows').innerHTML=ws.map((w,i)=>{
          const door=state.doors[i],compact=part('cab-rows').clientWidth<350;
          const options=(values,selected)=>values.map(([value,label])=>'<option value="'+value+'"'+(value===selected?' selected':'')+'>'+label+'</option>').join('');
          return '<div class="jn-cab-row"><span>'+(i+1)+'</span><span>'+num(w)+'</span><select class="jn-select" data-door="front" data-index="'+i+'" aria-label="'+(i+1)+'号柜前门">'+options([['auto',compact?'自动':'自动（'+(w>800?'双开':'单开')+'）'],['single','单开门'],['double','双开门']],door.front)+'</select><select class="jn-select" data-door="back" data-index="'+i+'" aria-label="'+(i+1)+'号柜后面">'+options([['panel','背板'],['single','单开门'],['double','双开门']],door.back)+'</select></div>';
        }).join('');
        part('ganged-tools').hidden=!ganged;
        part('manual-accessories').innerHTML=state.manual.map(name=>'<label class="jn-check"><input type="checkbox" data-accessory="'+escape(name)+'"'+(state.accessories[name]?' checked':'')+'/><span>'+escape(name)+' <span class="jn-note">· 手工选配</span></span></label>').join('');
        const spec=(ganged?'('+ws.map(num).join('+')+')':num(ws[0]))+'×'+num(state.depth)+'×'+num(state.height);
        part('footer-summary').textContent=ganged?ws.length+' 柜／组 × '+state.quantity+' 组 = '+ws.length*state.quantity+' 柜':state.quantity+' 台单柜';
        part('line-name').textContent=state.series+(ganged?' 并柜':' 单柜');
        part('line-spec').textContent=spec+' mm · '+state.material+' · '+state.coating+' · '+state.color;
        part('line-quantity').textContent=state.quantity+(ganged?' 组':' 台');
        part('line-cabinets').innerHTML=ws.map((w,i)=>(i+1)+'号柜　'+num(w)+'×'+num(state.depth)+'×'+num(state.height)+'　前门：'+frontText(state.doors[i],w)+'／后面：'+backText(state.doors[i])).join('<br>');
        root.querySelectorAll('[data-action="confirm"],[data-action="save"]').forEach(button=>button.disabled=!!error);
        part('dialog').hidden=!state.editing;part('workspace').classList.toggle('jn-editing',state.editing);part('order').inert=state.editing;
        root.querySelector('.jn-parameters').style.setProperty('--jn-gap',design.density==='compact'?'8px':'13px');
        draw(ws);
      }
      function syncInputs(){
        for(const key of ['width','quantity','depth','height','series','material','thickness','coating','color'])field(key).value=state[key];
        field('single-front').value=state.doors[0]?.front||'auto';field('single-back').value=state.doors[0]?.back||'panel';
        root.querySelectorAll('[data-accessory]').forEach(input=>input.checked=!!state.accessories[input.dataset.accessory]);
      }
      root.addEventListener('input',event=>{
        const key=event.target.dataset.field;if(!key)return;
        if(key.startsWith('single-'))return;
        state[key]=['quantity','depth','height','thickness'].includes(key)?Number(event.target.value):event.target.value;
        render();persist();
      });
      root.addEventListener('change',event=>{
        const input=event.target;
        if(input.dataset.door){state.doors[Number(input.dataset.index)][input.dataset.door]=input.value;render();persist();}
        if(input.dataset.field?.startsWith('single-')){state.doors[0][input.dataset.field==='single-front'?'front':'back']=input.value;render();persist();}
        if(input.dataset.accessory){state.accessories[input.dataset.accessory]=input.checked;persist();}
      });
      root.addEventListener('click',event=>{
        const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;
        if(['confirm','save','close'].includes(action)){if(action!=='close'&&validate())return;state.editing=false;}
        if(action==='open')state.editing=true;
        if(action==='connector'||action==='fill-board'){
          const name=action==='connector'?'并柜件':'填充安装板';
          if(!state.manual.includes(name))state.manual.push(name);state.accessories[name]=true;
        }
        render();syncInputs();persist();
      });
      hydrate(window.openai?.widgetState);render();syncInputs();
      window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState;if(value){hydrate(value);render();syncInputs();}});
      window.addEventListener('resize',render);
      if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.jn-parameters'),onChange:render});tweak.addSelect(design,'density',{label:'参数密度',options:[{label:'紧凑',value:'compact'},{label:'标准',value:'standard'}]});tweak.addToggle(design,'showDiagram',{label:'显示柜位示意'});}
    })();
  </script>
</div>
