  <script>
    (()=>{
      const root=document.getElementById('jn-order-cost-preview');
      const data=JSON.parse(root.querySelector('#jn-order-cost-data').textContent);
      const columns=[['unit','成本单价','成本单价'],['material','材料成本','材料成本'],['auxiliary','辅材成本','辅材成本'],['manufacturing','制造成本','制造成本'],['labor','人工成本','人工成本'],['accessory','附件成本','附件成本'],['spray','喷涂费用','喷涂费用'],['management','管理费用','管理费用'],['tax','税费（成本）','税费'],['freight','成本运费','运费'],['total','成本总价','成本总价'],['gross','毛利率','毛利率'],['net','净利率','净利率'],['weight','自制件重量','自制件重量']];
      const quoteColumns=['面价明细','固定报价','折扣面价','折扣系数','报价','运费','报价总价'];
      const defaults=['unit','total','gross','net'];
      const state={shown:[...defaults],quantities:data.rows.map(r=>Number(r.values['数量'])),menu:false,detail:null,detailType:'cost'};
      const design={compact:false,chatter:true};
      const writerId=Math.random().toString(36).slice(2);let returnFocus=null;
      const money=v=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
      const num=v=>Number(String(v??'').replaceAll(',',''));
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const originalQty=i=>Number(data.rows[i].values['数量']);
      const stale=i=>state.quantities[i]!==originalQty(i);
      function display(row,key){const value=row.values[key];return value===undefined||value===null||value===''?'—':value;}
      function apply(saved){if(!saved||saved.scheme!=='saved-order-cost-preview')return;if(Array.isArray(saved.shown))state.shown=saved.shown.filter(id=>columns.some(c=>c[0]===id));if(Array.isArray(saved.quantities)&&saved.quantities.length===data.rows.length)state.quantities=saved.quantities.map((q,i)=>Number.isInteger(q)&&q>0?q:originalQty(i));state.detail=Number.isInteger(saved.detail)&&saved.detail>=0&&saved.detail<data.rows.length?saved.detail:null;state.detailType=saved.detailType==='quote'?'quote':'cost';}
      apply(window.openai?.widgetState?.privateContent);
      function save(){const snapshot={scheme:'saved-order-cost-preview',writerId,shown:state.shown,quantities:state.quantities,detail:state.detail,detailType:state.detailType};window.openai?.setWidgetState({modelContent:{scheme:'订单明细报价结果与成本分组',source:data.number,quoteColumns,columns:columns.filter(c=>state.shown.includes(c[0])).map(c=>c[1]),detailRow:state.detail===null?null:state.detail+1,detailType:state.detailType},privateContent:snapshot})?.catch(()=>{});}
      function render(){
        root.classList.toggle('jn-compact',design.compact);root.classList.toggle('jn-show-chatter',design.chatter);root.querySelector('.jn-chatter').hidden=!design.chatter;
        root.querySelector('[data-quote-number]').textContent=data.number;root.querySelector('[data-order-title]').textContent='报价单';root.querySelector('[data-customer]').textContent=data.company;root.querySelector('[data-quote-date]').textContent=data.date;root.querySelector('[data-source]').textContent=data.number+' / V'+data.version;
        root.querySelector('[data-menu]').hidden=!state.menu;root.querySelector('[data-action=columns]').setAttribute('aria-expanded',String(state.menu));
        root.querySelector('[data-column-options]').innerHTML=columns.map(([id,label])=>'<label class="jn-check"><input type="checkbox" data-column="'+id+'" '+(state.shown.includes(id)?'checked':'')+'><span>'+esc(label)+'</span></label>').join('');
        const visible=columns.filter(c=>state.shown.includes(c[0]));
        const costCount=visible.filter(c=>!['gross','net','weight'].includes(c[0])).length;
        const profitCount=visible.filter(c=>['gross','net'].includes(c[0])).length;
        root.querySelector('[data-head]').innerHTML='<tr><th class="jn-group" colspan="2">产品信息</th><th class="jn-group jn-quote-col" colspan="7">报价结果</th>'+(costCount?'<th class="jn-group jn-cost-col" colspan="'+costCount+'">成本数据</th>':'')+(profitCount?'<th class="jn-group jn-cost-col" colspan="'+profitCount+'">利润率</th>':'')+(state.shown.includes('weight')?'<th class="jn-group jn-cost-col">重量</th>':'')+'<th class="jn-group" rowspan="2">操作</th></tr><tr><th class="jn-product">产品</th><th class="jn-num">数量</th>'+quoteColumns.map(label=>'<th class="jn-num jn-quote-col" data-quote-column>'+esc(label)+'</th>').join('')+visible.map(c=>'<th class="jn-num jn-cost-col">'+esc(c[1])+'</th>').join('')+'</tr>';
        root.querySelector('[data-rows]').innerHTML=data.rows.map((row,i)=>'<tr><td class="jn-product">'+esc(row.values['名称'])+'<small>'+esc(row.values['产品'])+' · '+esc(row.values['尺寸'])+'</small><small><span class="jn-status '+(stale(i)?'jn-status-stale':'')+'">'+(stale(i)?'需更新':'已读取')+'</span></small></td><td class="jn-num"><input type="number" min="1" step="1" class="jn-qty" aria-label="'+esc(row.values['名称'])+'数量" data-qty="'+i+'" value="'+state.quantities[i]+'"></td><td class="jn-num jn-quote-col"><button type="button" class="jn-link" data-quote-detail="'+i+'">'+esc(display(row,'已选附件'))+'</button></td><td class="jn-num jn-quote-col">'+esc(display(row,'固定报价'))+'</td><td class="jn-num jn-quote-col">'+esc(display(row,'折扣面价'))+'</td><td class="jn-num jn-quote-col">'+esc(display(row,'折扣系数'))+'</td><td class="jn-num jn-quote-col">'+esc(display(row,'报价'))+'</td><td class="jn-num jn-quote-col">'+esc(display(row,'报价运费'))+'</td><td class="jn-num jn-quote-col">'+money(num(row.values['报价'])*state.quantities[i])+'</td>'+visible.map(c=>'<td class="jn-num jn-cost-col '+(String(display(row,c[2])).startsWith('-')?'jn-negative':'')+'">'+esc(display(row,c[2]))+'</td>').join('')+'<td><button type="button" class="jn-link" data-detail="'+i+'">成本明细</button></td></tr>').join('');
        root.querySelector('[data-cost-total]').textContent='¥ '+money(data.rows.reduce((sum,r)=>sum+num(r.values['成本总价']),0));root.querySelector('[data-sale-total]').textContent='¥ '+money(data.rows.reduce((sum,r,i)=>sum+num(r.values['报价'])*state.quantities[i],0));
        const anyStale=data.rows.some((r,i)=>stale(i));root.querySelector('[data-warning]').hidden=!anyStale;root.querySelector('[data-source-status]').textContent=anyStale?'当前参数与原版本不同，保留原成本供核对':'已读取 '+data.rows.length+' 个产品 · 原版本已保存结果';
        const overlay=root.querySelector('[data-overlay]');overlay.hidden=state.detail===null;
        if(state.detail!==null){
          const row=data.rows[state.detail],isQuote=state.detailType==='quote';
          root.querySelector('#jn-cost-dialog-title').textContent=(isQuote?'面价明细 · ':'成本明细 · ')+row.values['名称'];root.querySelector('[data-detail-source]').textContent=data.number+' / V'+data.version+' / 原第 '+(state.detail+1)+' 行';
          const summaries=isQuote?[['固定报价',display(row,'固定报价')],['折扣面价',display(row,'折扣面价')],['报价',display(row,'报价')]]:[['成本单价',display(row,'成本单价')],['原版本数量',originalQty(state.detail)+' 台'],['成本总价',display(row,'成本总价')]];
          root.querySelector('[data-detail-summary]').innerHTML=summaries.map(([label,value])=>'<p><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></p>').join('');
          root.querySelector('[data-detail-grid]').hidden=isQuote;
          root.querySelector('[data-detail-grid]').innerHTML=columns.filter(c=>!['unit','total'].includes(c[0])).map(c=>'<div class="jn-detail-item"><span>'+esc(c[1])+'</span><strong>'+esc(display(row,c[2]))+'</strong></div>').join('');
          const breakdown=root.querySelector('[data-face-breakdown]');breakdown.hidden=!isQuote;
          if(isQuote)breakdown.innerHTML=row.priceBreakdown?['fixed','discounted'].map(key=>'<h3>'+ (key==='fixed'?'固定报价':'折扣面价')+'</h3><table><thead><tr><th>项目</th><th class="jn-num">原面价</th><th class="jn-num">系数</th><th class="jn-num">报价</th></tr></thead><tbody>'+((row.priceBreakdown[key]?.rows)||[]).map(item=>'<tr><td>'+esc(item.category)+'</td><td class="jn-num">'+money(item.original)+'</td><td class="jn-num">'+esc(item.discount)+'</td><td class="jn-num">'+money(item.amount)+'</td></tr>'+((item.details)||[]).map(d=>'<tr><td class="jn-child">'+esc(d.name)+'</td><td class="jn-num jn-muted">'+money(d.original)+'</td><td></td><td class="jn-num jn-muted">'+money(d.amount)+'</td></tr>').join('')).join('')+'</tbody></table>').join(''):'<span class="jn-muted">原版本未保存面价明细</span>';
          root.querySelector('[data-detail-unit]').textContent=isQuote?'金额：元／台或套；采用原报价已保存的组成。':'费用分项：元／台或套；自制件重量：kg／台或套。';
          root.querySelector('[data-detail-state]').textContent=stale(state.detail)?'当前数量已修改，原结果待更新':'已保存的历史结果';
        }
        const sheet=root.querySelector('.jn-sheet');sheet.style.minHeight='';
        if(state.detail!==null&&window.matchMedia('(min-width:601px)').matches)sheet.style.minHeight=Math.ceil(root.querySelector('.jn-modal').getBoundingClientRect().height+70)+'px';
      }
      render();
      root.addEventListener('click',event=>{
        const detail=event.target.closest('[data-detail],[data-quote-detail]');if(detail){returnFocus=detail;state.detailType=detail.dataset.quoteDetail!==undefined?'quote':'cost';state.detail=Number(detail.dataset.quoteDetail??detail.dataset.detail);state.menu=false;render();root.querySelector('[aria-label="关闭明细"]').focus();save();return;}
        const action=event.target.closest('[data-action]')?.dataset.action;
        if(action==='columns'){state.menu=!state.menu;render();}
        if(action==='all-columns'){state.shown=columns.map(c=>c[0]);render();save();}
        if(action==='close'){state.detail=null;render();const quoteIndex=returnFocus?.dataset.quoteDetail;root.querySelector(quoteIndex!==undefined?'[data-quote-detail="'+quoteIndex+'"]':'[data-detail="'+(returnFocus?.dataset.detail??0)+'"]')?.focus();save();}
        if(action==='restore'){state.quantities=data.rows.map((r,i)=>originalQty(i));render();save();}
        if(action==='read'){state.menu=false;render();if(data.rows.some((r,i)=>stale(i)))root.querySelector('[data-source-status]').textContent='原版本数量与当前不同，请先核对；原成本已保留。';else root.querySelector('[data-source-status]').textContent='已读取 '+data.rows.length+' 个产品 · '+data.number+' / V'+data.version;save();}
      });
      root.addEventListener('change',event=>{if(event.target.dataset.column){const id=event.target.dataset.column;state.shown=event.target.checked?[...new Set([...state.shown,id])]:state.shown.filter(v=>v!==id);render();save();}if(event.target.dataset.qty!==undefined){const i=Number(event.target.dataset.qty),value=Number(event.target.value);state.quantities[i]=Number.isInteger(value)&&value>0?value:originalQty(i);render();save();}});
      root.addEventListener('keydown',event=>{if(event.key==='Escape'){state.detail=null;state.menu=false;render();save();}});
      window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.writerId===writerId)return;apply(saved);render();});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'紧凑行高'});tweak.addToggle(design,'chatter',{label:'显示消息区域'});}
    })();
  </script>
